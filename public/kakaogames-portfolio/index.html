/* 카카오 글씨(OFL). 기기에 설치돼 있거나 fonts/ 폴더에 파일이 있으면 적용되고, 없으면 Pretendard로 보입니다. */
@font-face{font-family:"Kakao Big Sans";font-weight:400 600;font-display:swap;src:local("Kakao Big Sans Regular"),local("KakaoBigSans-Regular"),url(fonts/KakaoBigSans-Regular.woff2) format("woff2")}
@font-face{font-family:"Kakao Big Sans";font-weight:700;font-display:swap;src:local("Kakao Big Sans Bold"),local("KakaoBigSans-Bold"),url(fonts/KakaoBigSans-Bold.woff2) format("woff2")}
@font-face{font-family:"Kakao Big Sans";font-weight:800 900;font-display:swap;src:local("Kakao Big Sans ExtraBold"),local("KakaoBigSans-ExtraBold"),url(fonts/KakaoBigSans-ExtraBold.woff2) format("woff2")}
@font-face{font-family:"Kakao Small Sans";font-weight:400 500;font-display:swap;src:local("Kakao Small Sans Regular"),local("KakaoSmallSans-Regular"),url(fonts/KakaoSmallSans-Regular.woff2) format("woff2")}
@font-face{font-family:"Kakao Small Sans";font-weight:600 900;font-display:swap;src:local("Kakao Small Sans Bold"),local("KakaoSmallSans-Bold"),url(fonts/KakaoSmallSans-Bold.woff2) format("woff2")}
:root{
  --yellow:#FEE500;
  --yellow-soft:#FFF3A0;
  --ink:#191919;
  --cocoa:#3C1E1E;
  --paper:#ffffff;
  --night:#1d1916;
  --glide:1.6s;
  --n:min(100vw / 1440, 100vh / 900);
  --ui:"Kakao Small Sans","Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --big:"Kakao Big Sans","Pretendard Variable",Pretendard,sans-serif;
  --hand:"Nanum Pen Script","Pretendard Variable",cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--yellow)}
body{font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--cocoa);outline-offset:3px}
.is-case :focus-visible{outline-color:var(--yellow)}
.js .pre{opacity:0}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;overflow:hidden;background:var(--yellow);transition:background-color 1.2s cubic-bezier(.65,0,.35,1)}
.diving .stage,.is-case .stage{background:var(--night)}

/* photographic scene: two stacked 1440x810 frames sharing one transform, so the wordmark can sit between photo and cutout */
.frame{position:absolute;left:0;top:0;width:1440px;height:810px;transform-origin:0 0;will-change:transform;pointer-events:none}
.frame.glide{transition:transform var(--glide) cubic-bezier(.65,0,.35,1)}
#fA{z-index:0}
#fB{z-index:2}
.plate,.cut{position:absolute;left:0;top:-73.125px;width:1440px;height:956.25px;max-width:none;user-select:none;-webkit-user-drag:none}
.trans{position:absolute;left:0;top:0;width:1440px;height:810px;object-fit:cover;opacity:0}
.caseplate{position:absolute;left:0;top:-105.47px;width:1440px;height:956.25px;max-width:none;opacity:0}
.frame.shrunk .trans{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 170px,#000 calc(100% - 170px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 170px,#000 calc(100% - 170px),transparent 100%)}
.frame.shrunk .caseplate{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 170px,#000 calc(100% - 170px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 170px,#000 calc(100% - 170px),transparent 100%)}
.is-case .hero-el{pointer-events:none}

.wm{position:absolute;left:0;top:calc(var(--n)*40);width:100%;height:calc(var(--n)*270);overflow:visible;z-index:1}
.wm text{font-family:var(--big);font-weight:900;font-size:300px;letter-spacing:-8px}

.script{position:absolute;left:calc(50% + var(--n)*118);top:calc(var(--n)*262);z-index:3;
  font-family:var(--big);font-weight:800;font-size:calc(var(--n)*46);line-height:1;letter-spacing:-.03em;color:var(--ink);white-space:nowrap;
  background:#fff;padding:calc(var(--n)*20) calc(var(--n)*30);border-radius:calc(var(--n)*30);rotate:-4deg;transform-origin:0 50%;
  box-shadow:0 calc(var(--n)*4) 0 rgba(60,30,30,.25),0 calc(var(--n)*14) calc(var(--n)*26) rgba(60,30,30,.2)}
.script::after{content:"";position:absolute;left:calc(var(--n)*38);bottom:calc(var(--n)*-17);border:calc(var(--n)*10) solid transparent;border-top-color:#fff;border-left-color:#fff}

.intro{position:absolute;right:calc(var(--n)*30);bottom:calc(var(--n)*36);width:calc(var(--n)*300);z-index:3}
.intro h1{font-size:calc(var(--n)*38);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.intro p{margin-top:calc(var(--n)*10);font-size:calc(var(--n)*16.5);line-height:1.55;font-weight:500;color:var(--cocoa)}
.note{position:absolute;left:calc(var(--n)*34);bottom:calc(var(--n)*26);z-index:3;font-size:calc(var(--n)*12.5);font-weight:500;color:var(--cocoa);opacity:.7;text-align:left}

/* lanyard badge, drawn in CSS */
.badge-wrap{position:absolute;left:calc(var(--n)*150);top:0;z-index:4;width:calc(var(--n)*262)}
.badge{transform-origin:50% 0;display:flex;flex-direction:column;align-items:center}
.strap{width:calc(var(--n)*30);height:calc(var(--n)*268);background:var(--ink);position:relative}
.strap::after{content:"byeolter  byeolter  byeolter";position:absolute;left:50%;top:50%;translate:-50% -50%;rotate:90deg;white-space:pre;
  font-size:calc(var(--n)*11);font-weight:700;letter-spacing:.08em;color:var(--yellow)}
.clip{width:calc(var(--n)*22);height:calc(var(--n)*40);border-radius:calc(var(--n)*8);background:linear-gradient(90deg,#9a9a9a,#f2f2f2 45%,#8d8d8d);margin-top:calc(var(--n)*-4);position:relative;z-index:1}
.card{width:100%;margin-top:calc(var(--n)*-10);background:var(--paper);border-radius:calc(var(--n)*16);padding:calc(var(--n)*34) calc(var(--n)*20) calc(var(--n)*18);
  box-shadow:0 calc(var(--n)*5) 0 rgba(60,30,30,.22),0 calc(var(--n)*22) calc(var(--n)*40) rgba(60,30,30,.25);position:relative;cursor:grab}
.card::before{content:"";position:absolute;left:50%;top:calc(var(--n)*12);translate:-50% 0;width:calc(var(--n)*46);height:calc(var(--n)*9);border-radius:99px;background:var(--yellow);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.card h2{font-size:calc(var(--n)*30);line-height:.98;font-weight:900;letter-spacing:-.03em}

.card dl div{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:calc(var(--n)*6) 0 calc(var(--n)*4);border-bottom:1.5px dotted #555;font-size:calc(var(--n)*11.5)}
.card dt{font-weight:800}
.card dd{font-weight:600;text-align:right}

/* ---------- case screen ---------- */
.screen{position:absolute;z-index:6;background:var(--paper);overflow:hidden;opacity:0;visibility:hidden;container-type:size}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 38%)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:2;pointer-events:none}
.is-case .screen{visibility:visible}
.panel{position:absolute;inset:0;padding:5cqw 8cqw 4cqw 5.5cqw;display:grid;grid-template-columns:1.5fr .62fr;gap:4cqw;align-items:center;opacity:0;visibility:hidden}
.panel.on{opacity:1;visibility:visible}
.p-title{display:none}
.p-role{font-size:1.95cqw;font-weight:700;color:var(--cocoa)}
.panel h3{margin-top:1.6cqw;font-size:4cqw;line-height:1.22;text-wrap:balance;font-weight:800;letter-spacing:-.03em}
.panel ul{margin-top:2.6cqw;list-style:none;display:grid;gap:1.25cqw}
.panel li{font-size:2.1cqw;line-height:1.45;font-weight:500;padding-left:2.2cqw;position:relative}
.panel li::before{content:"";position:absolute;left:0;top:.62em;width:1cqw;height:1cqw;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 1.5px var(--ink)}
.p-foot{margin-top:2.8cqw;font-size:1.8cqw;font-weight:600;color:var(--cocoa)}
.p-foot a{font-weight:800;color:var(--ink);text-underline-offset:.2em}
.p-stat{aspect-ratio:1;border-radius:50%;background:var(--yellow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5cqw}
.p-stat b{font-size:6.4cqw;line-height:1;font-weight:900;letter-spacing:-.04em}
.p-stat span{margin-top:.9cqw;font-size:1.45cqw;line-height:1.3;font-weight:700;color:var(--cocoa)}
.panel.has-img{grid-template-columns:1.25fr .75fr;gap:3.5cqw}
.panel.has-img.l{grid-template-columns:1fr 1fr}
.has-img h3{font-size:3.3cqw}
.has-img li{font-size:1.85cqw}
.has-img ul{margin-top:2cqw;gap:1cqw}
.p-media{display:flex;align-items:center;justify-content:center;min-width:0}
.p-media img{display:block;max-width:100%;max-height:50cqw;border-radius:1.6cqw;box-shadow:0 0 0 .3cqw var(--ink),0 2cqw 4cqw rgba(0,0,0,.28)}
.p-chip{margin-top:2.2cqw;display:inline-flex;align-items:center;gap:1.2cqw;background:var(--yellow);border-radius:1.2cqw;padding:.9cqw 1.6cqw}
.p-chip b{font-family:var(--big);font-size:3cqw;line-height:1;font-weight:900;letter-spacing:-.04em;white-space:nowrap}
.p-chip span{font-size:1.4cqw;line-height:1.3;font-weight:700;color:var(--cocoa)}
.has-img .p-foot{margin-top:1.8cqw}
.panel.log{grid-template-columns:1fr;align-content:center}
.log ol{margin-top:2.4cqw;list-style:none;display:grid;gap:0}
.log ol li{display:grid;grid-template-columns:15cqw 1fr;gap:2cqw;padding:1.25cqw 0;border-bottom:1.5px dotted #555;font-size:2.05cqw;line-height:1.4}
.log ol li::before{display:none}
.log ol li b{font-weight:800}
.log ol li{padding-left:0}

/* ---------- pinned UI ---------- */
.ui{position:fixed;inset:0;z-index:20;pointer-events:none}
.ui>*{pointer-events:auto}
.tag{position:absolute;top:calc(var(--n)*14);height:calc(var(--n)*40);padding:0 calc(var(--n)*18);display:inline-flex;align-items:center;white-space:nowrap;
  background:var(--paper);color:var(--ink);font-weight:700;font-size:calc(var(--n)*16.5);letter-spacing:-.02em;text-decoration:none;border-radius:calc(var(--n)*6);
  box-shadow:0 calc(var(--n)*3) 0 rgba(60,30,30,.28),0 calc(var(--n)*6) calc(var(--n)*14) rgba(60,30,30,.18);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s cubic-bezier(.2,.8,.2,1)}
.tag:hover{transform:translateY(calc(var(--n)*-2)) rotate(-1.5deg);box-shadow:0 calc(var(--n)*5) 0 rgba(60,30,30,.3),0 calc(var(--n)*10) calc(var(--n)*18) rgba(60,30,30,.2)}
.tag:active{transform:translateY(calc(var(--n)*1));box-shadow:0 calc(var(--n)*1) 0 rgba(60,30,30,.3)}
.t1{left:calc(var(--n)*30)}
.t2{left:calc(var(--n)*112)}
.t3{right:calc(var(--n)*172)}
.t4{right:calc(var(--n)*32)}
.logo{position:absolute;left:50%;top:calc(var(--n)*22);translate:-50% 0;font-weight:800;font-size:calc(var(--n)*19);letter-spacing:.14em;color:#fff;opacity:0;visibility:hidden;transition:opacity .4s}
.is-case .logo{opacity:0;visibility:hidden}

.hint{position:absolute;left:50%;bottom:calc(var(--n)*22);translate:-50% 0;display:flex;align-items:center;gap:calc(var(--n)*12);
  padding:calc(var(--n)*9) calc(var(--n)*18);border-radius:99px;background:#fff;color:var(--ink);box-shadow:0 calc(var(--n)*3) 0 rgba(60,30,30,.28);font-size:calc(var(--n)*14);font-weight:600;white-space:nowrap}
.hint i{position:relative;width:2px;height:calc(var(--n)*20);background:rgba(25,25,25,.2);overflow:hidden}
.hint i::after{content:"";position:absolute;left:0;top:-40%;width:100%;height:40%;background:var(--ink);animation:drip 1.6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes drip{to{top:100%}}
.is-case .hint,.busy .hint{visibility:hidden}

.ticket{position:absolute;right:calc(var(--n)*20);top:calc(var(--n)*72);width:calc(var(--n)*292);min-height:calc(var(--n)*176);background:var(--paper);border-radius:calc(var(--n)*4);
  padding:calc(var(--n)*26) calc(var(--n)*34) calc(var(--n)*24) calc(var(--n)*42);box-shadow:0 calc(var(--n)*18) calc(var(--n)*40) rgba(0,0,0,.4);transform-origin:50% 0;opacity:0;visibility:hidden}
.is-case .ticket{visibility:visible}
.ticket i{position:absolute;width:calc(var(--n)*19);height:calc(var(--n)*19);border-radius:50%;background:var(--night);box-shadow:inset 0 calc(var(--n)*2) calc(var(--n)*3) rgba(0,0,0,.5)}
.ticket i:nth-of-type(1){left:calc(var(--n)*11);top:calc(var(--n)*11)}
.ticket i:nth-of-type(2){right:calc(var(--n)*11);top:calc(var(--n)*11)}
.ticket i:nth-of-type(3){left:calc(var(--n)*11);bottom:calc(var(--n)*11)}
.ticket i:nth-of-type(4){right:calc(var(--n)*11);bottom:calc(var(--n)*11)}
.ticket h2{font-size:calc(var(--n)*34);line-height:1;font-weight:900;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;padding-bottom:.08em}
.ticket p{text-align:right;font-weight:700;font-size:calc(var(--n)*13);padding:calc(var(--n)*5) 0 calc(var(--n)*4);border-bottom:1.5px dotted #2a2a2a}
.ticket h2+p{margin-top:calc(var(--n)*10)}

.desc{position:absolute;left:calc(var(--n)*24);top:calc(var(--n)*250);width:calc(var(--n)*196);text-shadow:0 1px 8px rgba(0,0,0,.6);color:#fff;visibility:hidden}
.is-case .desc{visibility:visible}
.desc>*{opacity:0}
.desc .k{font-weight:800;font-size:calc(var(--n)*19);letter-spacing:-.02em;color:var(--yellow)}
.desc .t{margin-top:calc(var(--n)*14);font-size:calc(var(--n)*15);line-height:1.6;font-weight:500;color:rgba(255,255,255,.92)}
.desc .num{margin-top:calc(var(--n)*22);font-size:calc(var(--n)*13);letter-spacing:.14em;font-weight:700;color:rgba(255,255,255,.7)}

.nav-case{position:absolute;bottom:calc(var(--n)*150);display:flex;flex-direction:column;align-items:center;gap:calc(var(--n)*9);color:#fff;opacity:0;visibility:hidden;transition:opacity .3s}
.is-case .nav-case{opacity:1;visibility:visible}
.nav-case.prev{left:calc(var(--n)*70)}
.nav-case.next{right:calc(var(--n)*70)}
.nav-case .c{width:calc(var(--n)*52);height:calc(var(--n)*52);border-radius:50%;border:1.6px solid rgba(255,255,255,.9);display:grid;place-items:center;transition:transform .25s,background-color .25s}
.nav-case svg{width:calc(var(--n)*24);height:calc(var(--n)*24);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-case span{font-weight:600;font-size:calc(var(--n)*15);line-height:1.15;text-align:center}
.nav-case.next .c{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.nav-case:hover .c{transform:scale(1.08)}
.nav-case.next:hover .c{background:#fff}

/* ---------- small screens ---------- */
@media (max-width:820px){
  :root{--n:calc(100vw / 430)}
  .tag{top:12px;height:32px;padding:0 12px;font-size:13.5px;border-radius:5px}
  .t1{left:12px}.t2{left:auto;right:12px}
  .t3{top:54px;left:12px;right:auto}.t4{top:54px;right:12px}
  .wm{top:104px;height:22vw}
  .script{left:5vw;top:calc(104px + 18vw);font-size:5.6vw;padding:2.6vw 4vw;border-radius:5vw}
  .script::after{left:6vw;bottom:-2.6vw;border-width:1.6vw}
  .trans{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 110px);mask-image:linear-gradient(180deg,transparent 0,#000 110px)}
  .caseplate{-webkit-mask-image:linear-gradient(180deg,transparent 105px,#000 215px);mask-image:linear-gradient(180deg,transparent 105px,#000 215px)}
  .note{display:none}
  .badge-wrap{left:auto;right:3vw;scale:.5;transform-origin:100% 0;z-index:3}
  .strap{height:calc(var(--n)*560)}
  .intro{left:5vw;right:38vw;width:auto;bottom:auto;top:calc(104px + 36vw)}
  .intro h1{font-size:24px}
  .intro p{margin-top:6px;font-size:13.5px;line-height:1.5}
  .hint{bottom:18px;font-size:12.5px;padding:8px 14px}
  .is-case .t3,.is-case .t4,.is-case .logo,.ticket,.desc{visibility:hidden!important}
  .screen{left:4vw;right:4vw;top:62px;bottom:calc(96px + env(safe-area-inset-bottom));border-radius:16px;box-shadow:0 0 0 5px var(--yellow)}
  .screen::after{display:none}
  .panel{grid-template-columns:1fr;align-content:center;gap:0;padding:7cqw 7cqw}
  .p-title{display:block;font-size:9cqw;font-weight:900;letter-spacing:-.04em;line-height:1;margin-bottom:3cqw}
  .p-role{font-size:3.7cqw}
  .panel h3{font-size:5.6cqw;margin-top:2.6cqw}
  .panel ul{margin-top:4.5cqw;gap:2.6cqw}
  .panel li{font-size:3.9cqw;padding-left:5cqw}
  .panel li::before{width:2.2cqw;height:2.2cqw}
  .p-foot{font-size:3.5cqw;margin-top:4.5cqw}
  .p-stat{order:9;aspect-ratio:auto;border-radius:12px;flex-direction:row;gap:3cqw;justify-content:flex-start;padding:3cqw 4cqw;margin-top:5cqw}
  .p-stat b{font-size:8cqw}
  .p-stat span{margin:0;font-size:3.4cqw;text-align:left}
  .panel.has-img,.panel.has-img.l{grid-template-columns:1fr;gap:0}
  .has-img h3{font-size:5.2cqw}
  .has-img li{font-size:3.7cqw}
  .has-img ul{margin-top:3.6cqw;gap:2cqw}
  .p-media{order:-1;margin-bottom:4cqw;justify-content:flex-start}
  .p-media img{max-height:28cqh;border-radius:3cqw;box-shadow:0 0 0 2px var(--ink)}
  .p-chip{margin-top:4cqw;gap:3cqw;border-radius:3cqw;padding:2.4cqw 4cqw}
  .p-chip b{font-size:7cqw}
  .p-chip span{font-size:3.3cqw}
  .has-img .p-foot{margin-top:3.4cqw}
  .has-img .p-title{font-size:8cqw;margin-bottom:2.4cqw}
  .log ol{margin-top:4cqw}
  .log ol li{grid-template-columns:1fr;gap:.6cqw;font-size:3.8cqw;padding:2.4cqw 0}
  .nav-case{bottom:calc(18px + env(safe-area-inset-bottom));flex-direction:row;gap:10px}
  .nav-case.prev{left:5vw}
  .nav-case.next{right:5vw;flex-direction:row-reverse}
  .nav-case .c{width:44px;height:44px}
  .nav-case svg{width:20px;height:20px}
  .nav-case span{font-size:13px}
  .nav-case br{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
h1,h2,h3,.p-title,.p-stat b,.tag,.logo{font-family:var(--big)}
</style>

  A(ticket,[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-40px) rotate(4deg)'}],{duration:380,easing:IN});

  [].forEach.call(document.querySelectorAll('.tag'),function(t,i){A(t,[{opacity:0,transform:'translateY(-40px) rotate(-4deg)'},{opacity:1,transform:'none'}],{duration:700,delay:120+i*80,easing:'cubic-bezier(.3,1.5,.5,1)',fill:'backwards'}).onfinish=function(){t.classList.remove('pre')};t.style.opacity=1});

/* hero <-> laptop dive */
function heroOut(){
  var o={duration:380,easing:IN};
  A(wm,[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-40px)'}],o);
  A(script,[{opacity:1},{opacity:0}],o);
  A(intro,[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(18px)'}],o);
  A(note,[{opacity:.7},{opacity:0}],o);
  if(sway){sway.cancel();sway=null}
  A(badgeWrap,[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-110%) rotate(-6deg)'}],o);
}
function heroIn(){
  A(wm,[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],{duration:700});
  A(script,[{opacity:0,clipPath:'inset(-60% 100% -60% 0)'},{opacity:1,clipPath:'inset(-60% -10% -60% -10%)'}],{duration:700,delay:250});
  A(intro,[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],{duration:700,delay:200});
  A(note,[{opacity:0},{opacity:.7}],{duration:600,delay:400});
  A(badgeWrap,[{opacity:0,transform:'translateY(-110%) rotate(6deg)'},{opacity:1,transform:'translateY(0) rotate(-2deg)',offset:.7},{opacity:1,transform:'rotate(0)'}],{duration:1100}).onfinish=startSway;
}
function playDive(){
  return new Promise(function(done){
    var fin=false;function end(){if(fin)return;fin=true;trans.pause();done()}
    function tick(){
      if(fin)return;
      var p=trans.currentTime/(trans.duration||5);
      if(trans.ended||p>=.995){end();return}
      trans.playbackRate=Math.max(1.2,1.8+2.4*Math.sin(Math.PI*Math.min(p*1.08,1)));
      requestAnimationFrame(tick);
    }
    trans.onended=end;setTimeout(end,6000);
    var pr=trans.play();if(pr&&pr.catch)pr.catch(end);
    requestAnimationFrame(tick);
  });
}
function arriveCase(){
  mode='case';idx=0;body.classList.add('is-case');fillCase(0);
  plate.style.visibility='hidden';A(cut,[{opacity:0},{opacity:0}],{duration:0});
  if(mq.matches)A(screen,[{opacity:0,scale:.3},{opacity:1,scale:1}],{duration:700,easing:GLIDE});
  else A(screen,[{opacity:0,scale:1},{opacity:1,scale:1}],{duration:300});
  A(flash,[{opacity:0},{opacity:.55},{opacity:0}],{duration:600,easing:'ease-out'});
  showPanel(0,1.06);caseIn(true);
  return wait(700).then(function(){busy=false;body.classList.remove('busy');glideOff()});
}
function toCase(){
  if(busy||mode!=='hero')return;busy=true;body.classList.add('busy');
  heroOut();
  wait(330).then(function(){
    body.classList.add('diving');
    if(RM||!transReady){
      place('case');plate.style.visibility='hidden';A(cut,[{opacity:1},{opacity:0}],{duration:260});
      A(caseplate,[{opacity:0},{opacity:1}],{duration:500});
      return wait(500);
    }
    try{trans.currentTime=0}catch(e){}
    trans.style.opacity=1;
    return new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})}).then(function(){
      plate.style.visibility='hidden';
      A(cut,[{opacity:1},{opacity:0}],{duration:260,easing:'ease-out'});
      glideOn(1.6);place('case');
      return playDive();
    }).then(function(){
      caseplate.getAnimations().forEach(function(a){a.cancel()});
      caseplate.style.opacity=1;trans.style.opacity=0;
    });
  }).then(arriveCase);
}
function toHero(){
  if(busy||mode!=='case')return;busy=true;body.classList.add('busy');
  caseOut();panels.forEach(function(p){p.classList.remove('on')});
  A(screen,[{opacity:1},{opacity:0}],{duration:300});
  wait(300).then(function(){
    mode='hero';body.classList.remove('is-case');body.classList.remove('diving');setLinks(-1);
    glideOn(.9);place('hero');
    plate.style.visibility='';
    A(cut,[{opacity:0},{opacity:1}],{duration:700,delay:150});
    caseplate.style.opacity='';
    A(caseplate,[{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(12px)'}],{duration:800,easing:GLIDE});
    A(plate,[{transform:'scale(1.12)',filter:'blur(8px)'},{transform:'scale(1)',filter:'blur(0)'}],{duration:900});
    return wait(250);
  }).then(function(){heroIn();return wait(1000)}).then(function(){busy=false;body.classList.remove('busy');glideOff()});
}
function swapTo(n){
  if(busy||mode!=='case'||n===idx)return;busy=true;
  var old=panels[idx];
  caseOut();
  A(old,[{opacity:1},{opacity:0}],{duration:320,easing:IN});
  wait(360).then(function(){idx=n;fillCase(n);showPanel(n);caseIn(false);return wait(520)}).then(function(){busy=false});
}
function next(){if(mode==='hero')toCase();else swapTo((idx+1)%CASES.length)}
function prev(){if(mode!=='case')return;if(idx===0)toHero();else swapTo(idx-1)}

$('#toCase').addEventListener('click',function(){if(mode==='hero')toCase()});
$('#toHero').addEventListener('click',toHero);
$('#logo').addEventListener('click',toHero);
$('#next').addEventListener('click',next);
$('#prev').addEventListener('click',prev);

var lock=0;
addEventListener('wheel',function(e){
  e.preventDefault();
  var t=Date.now();if(Math.abs(e.deltaY)<18||t<lock)return;lock=t+900;
  if(e.deltaY>0)next();else prev();
},{passive:false});
var ts=null;
addEventListener('touchstart',function(e){ts=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
addEventListener('touchend',function(e){
  if(!ts)return;var dx=e.changedTouches[0].clientX-ts[0],dy=e.changedTouches[0].clientY-ts[1];ts=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<40)return;
  if(Math.abs(dy)>=Math.abs(dx)){if(dy<0)next();else prev()}
  else if(mode==='case'){if(dx<0)next();else prev()}
},{passive:true});
addEventListener('keydown',function(e){
  var k=e.key,inBtn=/^(BUTTON|A)$/.test((document.activeElement||{}).tagName||'');
  if(k==='ArrowDown'||k==='PageDown'||(k===' '&&!inBtn)||(k==='ArrowRight'&&mode==='case')){e.preventDefault();next()}
  else if(k==='ArrowUp'||k==='PageUp'||(k==='ArrowLeft'&&mode==='case')){e.preventDefault();prev()}
  else if(k==='Escape'){toHero()}
});
})();
</script>
